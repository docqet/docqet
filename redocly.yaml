# Lints the OpenAPI spec the docs are built from: `npx redocly lint`.
apis:
  main:
    root: static/docs/api.yaml

extends:
  - recommended

rules:
  # A private API, with no license to name.
  info-license: off
  # The only servers listed are local: `docket serve` and `docket ui`.
  no-server-example.com: off
