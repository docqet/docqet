components:
  schemas:
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [up, down]
          description: up when every check is up, and down when any is down.
          example: up
        details:
          type: object
          description: >-
            One check per server the process is running (`http`), and one per
            dependency they use (`database`).
          additionalProperties:
            $ref: "#/components/schemas/HealthCheck"
          example:
            http:
              status: up
              timestamp: "2026-11-25T20:00:00Z"
            database:
              status: up
              provider: sqlite
              timestamp: "2026-11-25T20:00:00Z"
              latency_ms: 0

    HealthCheck:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [up, down]
        provider:
          type: string
          description: What provides a dependency.
          example: sqlite
        timestamp:
          type: string
          format: date-time
          description: When the check last ran. Results are cached for a second.
        latency_ms:
          type: integer
          description: How long a dependency's last check took, passed or failed.
          example: 0
        error:
          type: string
          description: Why the check is down. The cause itself is logged, not returned.
          example: unhealthy

    Trailer:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
          example: Docqet-Became
        value:
          type: string
          example: capability:early-arrival -> capability:early-check-in

    ApplyCommitRequest:
      type: object
      additionalProperties: false
      required: [parents, committedAt, trailers, state]
      properties:
        parents:
          type: array
          description: The commit's parents' full SHAs.
          items:
            type: string
          example: ["e496b9b0f3938d2f75391be063d2b43ebbfc3d81"]
        committedAt:
          type: string
          format: date-time
          description: When it was committed, which places it in history.
          example: "2026-11-26T00:25:56Z"
        trailers:
          type: array
          description: >-
            The `Docqet-Became` trailers of the commit and of every commit it
            brought in, as git reads them.
          items:
            $ref: "#/components/schemas/Trailer"
        state:
          $ref: "#/components/schemas/State"

    Commit:
      type: object
      required: [project, commit, product, parents, committedAt, appliedAt, trailers]
      properties:
        project:
          type: string
          example: hotel-bookings
        commit:
          type: string
          example: 57754415c7c52e1675e2a07edc9def8155be3729
        product:
          type: string
          nullable: true
          description: The product the project was part of at this commit.
          example: hotel
        parents:
          type: array
          items:
            type: string
        committedAt:
          type: string
          format: date-time
        appliedAt:
          type: string
          format: date-time
          description: When the server was last sent it.
        trailers:
          type: array
          items:
            $ref: "#/components/schemas/Trailer"

    Project:
      type: object
      required: [id, name, product, lastCommit]
      properties:
        id:
          type: string
          example: hotel-bookings
        name:
          type: string
          example: Hotel Bookings
        product:
          type: object
          nullable: true
          required: [id, name]
          properties:
            id:
              type: string
              example: hotel
            name:
              type: string
              example: Hotel
        lastCommit:
          $ref: "#/components/schemas/Commit"

    State:
      type: object
      description: >-
        A project's state, as `docqet index` writes it to `state.json`:
        every doc's entry, its evidence, reverse links and findings, and the
        rubric it was indexed against. The
        [state concept](https://github.com/docqet/docqet/blob/main/docqet/domains/authoring/concepts/state.md)
        describes every field.
      required: [docqet, project, commit, indexedAt, summary, findings, rubric]
      additionalProperties: true
      properties:
        docqet:
          type: string
          description: The version of the state format.
          example: "0.3"
        project:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        commit:
          type: string
        indexedAt:
          type: string
          format: date-time
        summary:
          type: object
          additionalProperties: true
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        rubric:
          type: object
          additionalProperties: true

    Finding:
      type: object
      required: [type, subject, capabilities, message]
      properties:
        type:
          type: string
          enum: [unknown-id, invalid-frontmatter, duplicate-id, broken-link, unlinked-rule, in-two-features, contradiction, invalid-annotation, unknown-outcome, solves-no-problem]
        subject:
          type: string
          description: >-
            The doc, gap or tradeoff it's about, or empty for a finding made
            reading a file, such as an annotation naming nothing.
          example: rule:no-double-booking
        capabilities:
          type: array
          items:
            type: string
        message:
          type: string
        domain:
          type: string
        file:
          type: string
        line:
          type: integer

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: this commit hasn't been applied for this project

    # The resources a product's routes return: each doc put together across
    # the product's projects, with the figures worked out for it.

    StringList:
      type: array
      items:
        type: string

    Maturity:
      type: object
      nullable: true
      description: >-
        A maturity: a whole percentage, and the level its band is named for.
        Null where there's none.
      required: [percent, band]
      properties:
        percent:
          type: integer
          example: 62
        band:
          type: string
          enum: [prototype, alpha, beta, ga]
          example: alpha

    Exposure:
      type: object
      description: What the gaps and rated decisions open on some capabilities put at stake together.
      required: [percent, capabilities, band, unacceptable]
      properties:
        percent:
          type: number
          nullable: true
          description: Unrounded, 0 to 100, and null with nothing started.
          example: 38.5
        capabilities:
          type: integer
          description: How many started capabilities it's worked out from.
          example: 4
        band:
          type: string
          nullable: true
          enum: [low, minor, moderate, high, null]
          description: Null with nothing started.
          example: minor
        unacceptable:
          type: boolean
          description: Whether any gap is unacceptable on one of them.

    ScoredGap:
      type: object
      description: >-
        A gap's score among some capabilities: where it scores highest there,
        null where it doesn't show, and that score and verdict, 0 where it
        doesn't show.
      required: [gap, capability, score, verdict]
      properties:
        gap:
          type: string
          example: capability:room-booking#calendar-needs-a-mouse@hotel-bookings
        capability:
          type: string
          nullable: true
          example: room-booking
        score:
          type: integer
          example: 54
        verdict:
          type: string
          enum: [unacceptable, tolerable, acceptable]
          example: tolerable

    RiskSummary:
      type: object
      description: What's at stake across some gaps.
      required: [score, verdict, counts, gaps]
      properties:
        score:
          type: integer
          nullable: true
          description: The highest score, null with no gaps.
          example: 54
        verdict:
          type: string
          nullable: true
          enum: [unacceptable, tolerable, acceptable, null]
          description: The highest score's verdict, null with no gaps.
          example: tolerable
        counts:
          type: object
          description: How many gaps fall in each verdict.
          additionalProperties:
            type: integer
          example:
            unacceptable: 0
            tolerable: 2
            acceptable: 1
        gaps:
          type: array
          description: Each gap, riskiest first, with its score there.
          items:
            $ref: "#/components/schemas/ScoredGap"

    Readiness:
      type: object
      description: >-
        How ready people can rely on some capabilities being, with its
        improvements: what would raise it, most first.
      required: [percent, band, maturity, exposure, levels, gaps, started, notStarted, improvements, areas]
      properties:
        percent:
          type: integer
          nullable: true
          description: Rounded, and null with nothing started.
          example: 45
        band:
          type: string
          nullable: true
          enum: [Unready, Partial, Viable, Ready, null]
          description: Null with nothing started.
          example: Partial
        maturity:
          type: number
          nullable: true
          description: The capabilities' own maturity, unrounded, weighted by level.
          example: 51.2
        exposure:
          $ref: "#/components/schemas/Exposure"
        levels:
          $ref: "#/components/schemas/StringList"
        gaps:
          $ref: "#/components/schemas/RiskSummary"
        started:
          type: integer
          description: How many started capabilities it's worked out from.
          example: 6
        notStarted:
          type: array
          description: The capabilities still drafts, which never count.
          items:
            type: string
        improvements:
          type: array
          description: What would raise it, one thing at a time, most first. Only what would raise it is listed.
          items:
            $ref: "#/components/schemas/Improvement"
        areas:
          type: array
          description: >-
            Where it could rise, one level below what it's of, by how far,
            most first: a product's domains, a domain's, persona's or
            initiative's features, a feature's capabilities, or a
            capability's steps, with each gap or decision that spans more
            than one of them. Only what would raise it is listed.
          items:
            $ref: "#/components/schemas/Area"

    Area:
      type: object
      description: >-
        Somewhere a readiness could rise, with how far: a domain, feature or
        capability, or one step. Potentials overlap, a capability can be in
        more than one area, so they don't add up.
      required: [kind, domain, feature, capability, capabilities, potential, next]
      properties:
        kind:
          type: string
          enum: [domain, feature, capability, gap, decision, promotion]
          example: feature
        domain:
          type: string
          nullable: true
          description: The domain it is, null otherwise.
          example: guest-stays
        feature:
          type: string
          nullable: true
          description: The feature it is, null otherwise.
          example: front-desk
        capability:
          type: string
          nullable: true
          description: The capability it is, null otherwise.
          example: check-in
        capabilities:
          type: array
          description: The capabilities counted that are in it.
          items:
            type: string
        potential:
          type: number
          description: >-
            What readiness would be with all of it settled, unrounded: every
            capability in it at GA with nothing open on it, or its step taken.
          example: 70.2
        next:
          description: The step in it that would raise readiness most, null when no one step does.
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Improvement"

    Improvement:
      type: object
      description: >-
        Something that would raise a readiness, and by how much: promoting a
        capability to its next level, promoting every capability in a feature
        or a domain to its next level, closing a gap, or answering a rated
        decision. It's what could be done, not what has to be.
      required: [kind, capability, from, to, feature, domain, gap, decision, capabilities, readiness, maturity, exposure, gain, band]
      properties:
        kind:
          type: string
          enum: [promote, promote-feature, promote-domain, close, answer]
          example: close
        capability:
          type: string
          nullable: true
          description: The capability a promotion is of, null otherwise.
          example: check-in
        from:
          type: string
          nullable: true
          description: A promotion's level now, null otherwise.
          example: beta
        to:
          type: string
          nullable: true
          description: The level a promotion reaches, null otherwise.
          example: ga
        feature:
          type: string
          nullable: true
          description: The feature whose capabilities a promote-feature promotes, each to its next level, null otherwise.
          example: front-desk
        domain:
          type: string
          nullable: true
          description: The domain whose capabilities a promote-domain promotes, each to its next level, null otherwise.
          example: guest-stays
        gap:
          type: string
          nullable: true
          description: The gap to close, null otherwise.
          example: mechanism:deployment#migrations-only-go-forward@hotel-bookings
        decision:
          description: The decision to answer, null otherwise.
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/HeldDecision"
        capabilities:
          type: array
          description: Where it changes something among those counted, and for a promote-feature or promote-domain, the capabilities it promotes.
          items:
            type: string
        readiness:
          type: number
          description: What readiness would be after it, unrounded.
          example: 38.1
        maturity:
          type: number
          description: What maturity would be after it, unrounded.
          example: 59.3
        exposure:
          type: number
          description: What exposure would be after it, unrounded.
          example: 35.7
        gain:
          type: number
          description: How much readiness it would add, unrounded.
          example: 14.4
        band:
          type: string
          nullable: true
          enum: [Unready, Partial, Viable, Ready, null]
          description: The quarter readiness would move into, null when it stays in the same one.
          example: Partial

    Decision:
      type: object
      description: >-
        An open decision, with what its answer could change rated as a gap's
        risk is, read about the change: all three null when it isn't rated.
      required: [topic, question, affects, impact, likelihood, reach]
      properties:
        topic:
          type: string
          nullable: true
          example: Cancellations
        question:
          type: string
          example: Should a late cancellation be charged a night?
        affects:
          $ref: "#/components/schemas/StringList"
        impact:
          type: string
          nullable: true
          enum: [negligible, inconvenient, blocking, damaging, null]
          example: damaging
        likelihood:
          type: string
          nullable: true
          enum: [certain, expected, possible, unlikely, null]
          example: expected
        reach:
          type: string
          nullable: true
          enum: [all, most, some, few, null]
          example: some

    HeldDecision:
      description: An open decision, with the doc it's on and its risk.
      allOf:
        - $ref: "#/components/schemas/Decision"
        - type: object
          required: ["on", risk]
          properties:
            "on":
              type: string
              description: >-
                The doc it's on, as a reference: `domain:`, `feature:`,
                `capability:`, `mechanism:` or `component:`.
              example: capability:room-booking
            risk:
              description: >-
                What's at stake in its answer changing what people rely on,
                scored on each capability it counts on: null when it isn't
                rated.
              type: object
              nullable: true
              allOf:
                - $ref: "#/components/schemas/Risk"

    Confusion:
      type: object
      description: What a concept is easily mistaken for.
      required: [concept, term, summary]
      properties:
        concept:
          type: string
          nullable: true
        term:
          type: string
          nullable: true
        summary:
          type: string

    Contribution:
      type: object
      description: What one project says about a doc, in one domain.
      required: [project, domain, file, name, description, body]
      properties:
        project:
          type: string
          example: hotel-bookings
        domain:
          type: string
          example: bookings
        file:
          type: string
          example: docqet/domains/bookings/capabilities/room-booking.md
        name:
          type: string
        description:
          type: string
        body:
          type: string
          description: The doc's markdown body.
        role:
          type: string
          nullable: true
          description: A persona's role.
        title:
          type: string
          nullable: true
          description: A persona's title.
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/Decision"
        why:
          type: string
          nullable: true
          description: Why a rule holds.
        confusedWith:
          type: array
          description: What a concept is easily mistaken for.
          items:
            $ref: "#/components/schemas/Confusion"

    Place:
      type: object
      description: Where an annotation is, in which project's files.
      required: [project, file, line, text]
      properties:
        project:
          type: string
          example: hotel-bookings
        file:
          type: string
          example: internal/bookings/service.go
        line:
          type: integer
          example: 42
        text:
          type: string

    Evidence:
      type: object
      description: The places that implement or verify a doc.
      required: [implements, verifies]
      properties:
        implements:
          type: array
          items:
            $ref: "#/components/schemas/Place"
        verifies:
          type: array
          items:
            $ref: "#/components/schemas/Place"

    Doc:
      type: object
      description: >-
        What every doc has: what its first contribution says, and every
        contribution.
      required: [id, project, domain, file, name, description, body, from]
      properties:
        id:
          type: string
          description: >-
            Its ID, as combining keys it: a rule or concept is
            `<id>@<domain>`.
          example: room-booking
        project:
          type: string
          example: hotel-bookings
        domain:
          type: string
          example: bookings
        file:
          type: string
        name:
          type: string
          example: Room booking
        description:
          type: string
        body:
          type: string
          description: The doc's markdown body.
        from:
          type: array
          description: What each project says about it, in each domain.
          items:
            $ref: "#/components/schemas/Contribution"

    ProductProject:
      type: object
      description: >-
        One of a product's projects, from its state, with its maturity from
        its own features alone.
      required: [id, name, product, commit, indexedAt, maturity]
      properties:
        id:
          type: string
          example: hotel-bookings
        name:
          type: string
          example: Hotel Bookings
        product:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              example: hotel
            name:
              type: string
              example: Hotel
        commit:
          type: string
          example: 57754415c7c52e1675e2a07edc9def8155be3729
        indexedAt:
          type: string
          format: date-time
        maturity:
          $ref: "#/components/schemas/Maturity"

    Product:
      type: object
      description: A product, its projects, and the maturity of what's showing.
      required: [id, name, projects, maturity]
      properties:
        id:
          type: string
          example: hotel
        name:
          type: string
          example: Hotel
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ProductProject"
        maturity:
          $ref: "#/components/schemas/Maturity"

    Counts:
      type: object
      description: How many of each there are, showing.
      required: [domains, features, capabilities, rules, concepts, personas, initiatives, mechanisms, components, gaps, tradeoffs, decisions, findings]
      properties:
        domains:
          type: integer
        features:
          type: integer
        capabilities:
          type: object
          description: By level.
          additionalProperties:
            type: integer
          example:
            draft: 1
            prototype: 3
            alpha: 2
            beta: 0
            ga: 0
        rules:
          type: integer
        concepts:
          type: integer
        personas:
          type: integer
        initiatives:
          type: integer
        mechanisms:
          type: integer
        components:
          type: integer
        gaps:
          type: integer
        tradeoffs:
          type: integer
        decisions:
          type: integer
        findings:
          type: integer

    Status:
      type: object
      description: >-
        The product at a glance, or what serves a `?for=`: that narrows its
        maturity, readiness, exposure and risk, but its counts are always the
        product's, as shown.
      required: [maturity, readiness, exposure, risk, counts]
      properties:
        maturity:
          $ref: "#/components/schemas/Maturity"
        readiness:
          $ref: "#/components/schemas/Readiness"
        exposure:
          $ref: "#/components/schemas/Exposure"
        risk:
          $ref: "#/components/schemas/RiskSummary"
        counts:
          $ref: "#/components/schemas/Counts"

    Domain:
      description: >-
        A domain, with its maturity from its parts of features, and the
        readiness and exposure of every capability with a part in it.
      allOf:
        - $ref: "#/components/schemas/Doc"
        - type: object
          required: [features, capabilities, maturity, readiness, exposure]
          properties:
            features:
              $ref: "#/components/schemas/StringList"
            capabilities:
              $ref: "#/components/schemas/StringList"
            maturity:
              $ref: "#/components/schemas/Maturity"
            readiness:
              $ref: "#/components/schemas/Readiness"
            exposure:
              $ref: "#/components/schemas/Exposure"

    Part:
      type: object
      description: One domain's part of a feature.
      required: [domain, capabilities, maturity]
      properties:
        domain:
          type: string
          example: bookings
        capabilities:
          $ref: "#/components/schemas/StringList"
        maturity:
          $ref: "#/components/schemas/Maturity"

    Feature:
      description: A feature, with its parts and figures.
      allOf:
        - $ref: "#/components/schemas/Doc"
        - type: object
          required: [capabilities, tradeoffs, parts, maturity, readiness, exposure]
          properties:
            capabilities:
              $ref: "#/components/schemas/StringList"
            tradeoffs:
              $ref: "#/components/schemas/StringList"
            parts:
              type: array
              items:
                $ref: "#/components/schemas/Part"
            maturity:
              $ref: "#/components/schemas/Maturity"
            readiness:
              $ref: "#/components/schemas/Readiness"
            exposure:
              $ref: "#/components/schemas/Exposure"

    Level:
      type: object
      description: A capability's level in one domain that builds it.
      required: [project, domain, level]
      properties:
        project:
          type: string
          example: hotel-bookings
        domain:
          type: string
          example: bookings
        level:
          type: string
          example: alpha

    TechnicalGap:
      type: object
      description: A gap on a mechanism or component a capability is built on.
      required: [gap, "on"]
      properties:
        gap:
          type: string
        "on":
          type: string
          description: "`mechanism:<id>` or `component:<id>`."
          example: component:ledger

    Open:
      type: object
      description: >-
        What's open on a capability: its open decisions, its own gaps, and the
        gaps on what it's built on.
      required: [decisions, gaps, technical]
      properties:
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/Decision"
        gaps:
          $ref: "#/components/schemas/StringList"
        technical:
          type: array
          items:
            $ref: "#/components/schemas/TechnicalGap"

    OutcomeStanding:
      type: object
      description: >-
        How a capability stands on one of the rubric's expected outcomes, with
        what says so.
      required: [outcome, standing, gaps, tradeoffs, decisions, by]
      properties:
        outcome:
          type: string
          example: outcome:security/alpha/secrets-kept
        standing:
          type: string
          enum: [not-expected, gap, tradeoff, open, evidence, trust]
        gaps:
          $ref: "#/components/schemas/StringList"
        tradeoffs:
          $ref: "#/components/schemas/StringList"
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/Decision"
        by:
          type: array
          description: The mechanisms and components that meet it.
          items:
            type: string

    Capability:
      description: >-
        A capability, with its figures, what's open on it, and how it stands
        on each rule it follows and each expected outcome.
      allOf:
        - $ref: "#/components/schemas/Doc"
        - type: object
          required: [personas, initiatives, stability, levels, feature, rules, concepts, gaps, tradeoffs, builtBy, evidence, readiness, exposure, risk, open, ruleStandings, outcomes]
          properties:
            personas:
              $ref: "#/components/schemas/StringList"
            initiatives:
              $ref: "#/components/schemas/StringList"
            stability:
              type: string
              description: Its level in short, or draft.
              example: alpha
            levels:
              type: array
              items:
                $ref: "#/components/schemas/Level"
            feature:
              type: string
              nullable: true
              example: reservations
            rules:
              $ref: "#/components/schemas/StringList"
            concepts:
              $ref: "#/components/schemas/StringList"
            gaps:
              $ref: "#/components/schemas/StringList"
            tradeoffs:
              $ref: "#/components/schemas/StringList"
            builtBy:
              $ref: "#/components/schemas/StringList"
            evidence:
              $ref: "#/components/schemas/Evidence"
            readiness:
              $ref: "#/components/schemas/Readiness"
            exposure:
              $ref: "#/components/schemas/Exposure"
            risk:
              $ref: "#/components/schemas/RiskSummary"
            open:
              $ref: "#/components/schemas/Open"
            ruleStandings:
              type: object
              description: >-
                How it stands on each rule it follows, by the rule's ID: gap,
                evidence or trust.
              additionalProperties:
                type: string
                enum: [gap, evidence, trust]
            outcomes:
              type: array
              items:
                $ref: "#/components/schemas/OutcomeStanding"

    Rule:
      description: A rule, with how each capability that follows it stands on it.
      allOf:
        - $ref: "#/components/schemas/Doc"
        - type: object
          required: [capabilities, concepts, gaps, evidence, standings]
          properties:
            capabilities:
              $ref: "#/components/schemas/StringList"
            concepts:
              $ref: "#/components/schemas/StringList"
            gaps:
              $ref: "#/components/schemas/StringList"
            evidence:
              $ref: "#/components/schemas/Evidence"
            standings:
              type: object
              description: By capability ID.
              additionalProperties:
                type: string
                enum: [gap, evidence, trust]

    Concept:
      description: A concept.
      allOf:
        - $ref: "#/components/schemas/Doc"
        - type: object
          required: [capabilities, rules]
          properties:
            capabilities:
              $ref: "#/components/schemas/StringList"
            rules:
              $ref: "#/components/schemas/StringList"

    Persona:
      description: A persona, with the figures of what serves them.
      allOf:
        - $ref: "#/components/schemas/Doc"
        - type: object
          required: [role, title, image, capabilities, features, initiatives, maturity, readiness, exposure]
          properties:
            role:
              type: string
              nullable: true
            title:
              type: string
              nullable: true
            image:
              type: string
              nullable: true
            capabilities:
              $ref: "#/components/schemas/StringList"
            features:
              $ref: "#/components/schemas/StringList"
            initiatives:
              $ref: "#/components/schemas/StringList"
            maturity:
              $ref: "#/components/schemas/Maturity"
            readiness:
              $ref: "#/components/schemas/Readiness"
            exposure:
              $ref: "#/components/schemas/Exposure"

    Initiative:
      description: An initiative, with the figures of its capabilities.
      allOf:
        - $ref: "#/components/schemas/Doc"
        - type: object
          required: [capabilities, features, personas, maturity, readiness, exposure]
          properties:
            capabilities:
              $ref: "#/components/schemas/StringList"
            features:
              $ref: "#/components/schemas/StringList"
            personas:
              $ref: "#/components/schemas/StringList"
            maturity:
              $ref: "#/components/schemas/Maturity"
            readiness:
              $ref: "#/components/schemas/Readiness"
            exposure:
              $ref: "#/components/schemas/Exposure"

    Technical:
      description: A mechanism or a component, with what's at stake in its gaps.
      allOf:
        - $ref: "#/components/schemas/Doc"
        - type: object
          required: [kind, applies, capabilities, meets, gaps, tradeoffs, evidence, risk]
          properties:
            kind:
              type: string
              enum: [mechanism, component]
            applies:
              type: string
              enum: [project, product]
            capabilities:
              $ref: "#/components/schemas/StringList"
            meets:
              $ref: "#/components/schemas/StringList"
            gaps:
              $ref: "#/components/schemas/StringList"
            tradeoffs:
              $ref: "#/components/schemas/StringList"
            evidence:
              $ref: "#/components/schemas/Evidence"
            risk:
              $ref: "#/components/schemas/RiskSummary"

    RiskOn:
      type: object
      description: How a gap scores on one capability, and why.
      required: [capability, impact, likelihood, reach, weight, claim, claimFactor, raw, score]
      properties:
        capability:
          type: string
        impact:
          type: number
        likelihood:
          type: number
        reach:
          type: number
        weight:
          type: number
        claim:
          type: boolean
        claimFactor:
          type: number
        raw:
          type: number
        score:
          type: integer

    Spread:
      type: object
      description: How many capabilities a gap has one score on.
      required: [score, capabilities]
      properties:
        score:
          type: integer
        capabilities:
          type: integer

    Risk:
      type: object
      description: >-
        What's at stake in leaving a gap open, on every capability it shows
        on. Score is 0 where it shows on none.
      required: [score, verdict, claim, capabilities, spread, "on"]
      properties:
        score:
          type: integer
        verdict:
          type: string
          enum: [unacceptable, tolerable, acceptable]
        claim:
          type: boolean
        capabilities:
          type: integer
        spread:
          type: array
          items:
            $ref: "#/components/schemas/Spread"
        "on":
          type: array
          items:
            $ref: "#/components/schemas/RiskOn"

    Affected:
      type: object
      description: >-
        One thing a gap, tradeoff or decision affects, by reference: an
        expected outcome, with its quality, a rule, a gap or a tradeoff.
      required: [kind, ref]
      properties:
        kind:
          type: string
          example: outcome
        ref:
          type: string
          example: outcome:security/alpha/secrets-kept
        quality:
          type: string
          nullable: true
          example: security

    Gap:
      type: object
      description: >-
        A gap, with its risk, what it affects, and the open decisions that
        affect it.
      required: [id, subject, project, domain, affects, impact, likelihood, reach, name, description, places, risk, affected, decisions, within]
      properties:
        id:
          type: string
          description: Its declared ID, with `@<project>`.
          example: capability:room-booking#calendar-needs-a-mouse@hotel-bookings
        subject:
          type: string
          description: The doc it's on, as a reference.
          example: capability:room-booking
        project:
          type: string
        domain:
          type: string
        affects:
          $ref: "#/components/schemas/StringList"
        impact:
          type: string
          enum: [negligible, inconvenient, blocking, damaging]
        likelihood:
          type: string
          enum: [certain, expected, possible, unlikely]
        reach:
          type: string
          enum: [all, most, some, few]
        name:
          type: string
        description:
          type: string
        places:
          type: array
          items:
            $ref: "#/components/schemas/Place"
        risk:
          $ref: "#/components/schemas/Risk"
        affected:
          type: array
          items:
            $ref: "#/components/schemas/Affected"
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/HeldDecision"
        within:
          description: >-
            Its score among the capabilities `?for=` names, on a list read
            with one, and null otherwise.
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ScoredGap"

    Tradeoff:
      type: object
      description: >-
        A tradeoff, with what it affects and the open decisions that affect
        it.
      required: [id, subject, project, domain, affects, name, description, benefit, drawback, places, affected, decisions]
      properties:
        id:
          type: string
          description: Its declared ID, with `@<project>`.
        subject:
          type: string
          description: The doc it's on, as a reference.
          example: feature:reservations
        project:
          type: string
        domain:
          type: string
        affects:
          $ref: "#/components/schemas/StringList"
        name:
          type: string
        description:
          type: string
        benefit:
          type: string
          nullable: true
        drawback:
          type: string
        places:
          type: array
          items:
            $ref: "#/components/schemas/Place"
        affected:
          type: array
          items:
            $ref: "#/components/schemas/Affected"
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/HeldDecision"

    SearchResult:
      type: object
      description: A doc that matches a search.
      required: [kind, id, name, description, match]
      properties:
        kind:
          type: string
          enum: [project, domain, feature, capability, rule, concept, persona, initiative]
        id:
          type: string
          example: room-booking
        name:
          type: string
        description:
          type: string
        match:
          type: string
          enum: [name, description, body]
          description: Where it matched.

    Rubric:
      type: object
      description: >-
        The stability rubric: what each stability level expects, as the
        product's projects were indexed against it.
      required: [kinds, qualities]
      properties:
        kinds:
          type: array
          description: The kinds of software an example in the rubric can suit.
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
                example: api
              name:
                type: string
                example: API
        qualities:
          type: array
          items:
            $ref: "#/components/schemas/RubricQuality"

    RubricQuality:
      type: object
      description: One of the rubric's qualities, with its levels in order.
      required: [id, name, question, why, levels]
      properties:
        id:
          type: string
          example: security
        name:
          type: string
          example: Security
        question:
          type: string
        why:
          type: string
        levels:
          type: array
          items:
            $ref: "#/components/schemas/RubricLevel"

    RubricLevel:
      type: object
      description: What a quality expects at one stability level.
      required: [level, summary, outcomes, implementation, overengineering]
      properties:
        level:
          type: string
          example: alpha
        summary:
          type: string
          nullable: true
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/RubricOutcome"
        implementation:
          type: array
          items:
            $ref: "#/components/schemas/RubricExample"
        overengineering:
          type: array
          items:
            $ref: "#/components/schemas/RubricExample"

    RubricOutcome:
      type: object
      description: >-
        Something that should be true of the work at a level. Its reference is
        `outcome:<quality>/<level>/<id>`.
      required: [id, level, text, until, implementation, overengineering]
      properties:
        id:
          type: string
        level:
          type: string
        text:
          type: string
        until:
          type: string
          nullable: true
        implementation:
          type: array
          items:
            $ref: "#/components/schemas/RubricExample"
        overengineering:
          type: array
          items:
            $ref: "#/components/schemas/RubricExample"

    RubricExample:
      type: object
      description: An example of meeting an outcome, or of overengineering it.
      required: [text, kinds]
      properties:
        text:
          type: string
        kinds:
          $ref: "#/components/schemas/StringList"

  parameters:
    Project:
      name: project
      in: path
      required: true
      description: The project's ID, from its `docqet.yaml`.
      schema:
        type: string
        example: hotel-bookings
    SHA:
      name: sha
      in: path
      required: true
      description: The commit's full SHA.
      schema:
        type: string
        example: 57754415c7c52e1675e2a07edc9def8155be3729
    Product:
      name: product
      in: path
      required: true
      description: >-
        The product's ID: the one its projects declare, or else the ID of a
        project that declares none, which is a product of its own.
      schema:
        type: string
        example: hotel
    ProjectsShown:
      name: project
      in: query
      required: false
      description: >-
        Show only these of the product's projects, by ID, separated by
        commas. A project that isn't the product's is a 400.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
        example: [hotel-bookings, hotel-billing]
    Initiative:
      name: initiative
      in: query
      required: false
      description: Show only what's part of this initiative, by ID.
      schema:
        type: string
        example: mvp
    For:
      name: for
      in: query
      required: false
      description: >-
        A reference to a project, persona, initiative, domain, feature or
        capability, as the CLI's `--for`: count only its capabilities.
        Several, separated by commas, count
        only the capabilities they all share, such as
        `persona:front-desk-clerk,feature:front-desk`. One that names nothing
        showing is a 400.
      schema:
        type: string
        example: persona:front-desk-clerk
    Page:
      name: page
      in: query
      required: false
      description: The page to return, from 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      description: How many items a page holds.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    DocID:
      name: id
      in: path
      required: true
      description: The doc's ID, as it's declared.
      schema:
        type: string
        example: room-booking
    Domain:
      name: domain
      in: path
      required: true
      description: The ID of the domain the doc is in.
      schema:
        type: string
        example: bookings
    GapKey:
      name: key
      in: path
      required: true
      description: >-
        The gap's key on the doc it's on: what follows the `#` in its
        reference.
      schema:
        type: string
        example: calendar-needs-a-mouse

  headers:
    Link:
      description: >-
        Links to the pages around this one, as `first`, `prev`, `next` and
        `last`. Left out when everything fits on one page.
      schema:
        type: string
        example: '<http://localhost:8080/api/v1/products/hotel/gaps?page=2&size=100>; rel="next"'
    TotalCount:
      description: How many items there are across every page.
      schema:
        type: integer
        example: 240

  responses:
    BadRequest:
      description: The body isn't a valid state, or it's for another project or commit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Nothing has been applied for the project, or not that commit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidQuery:
      description: >-
        A query value isn't one, such as a page or size out of range, or the
        scope names a project that isn't the product's, or a reference that
        names nothing showing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProductNotFound:
      description: There's no such product.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DocNotFound:
      description: There's no such product, or no such doc showing in it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
