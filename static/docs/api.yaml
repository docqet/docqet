openapi: 3.0.3
info:
  title: Docqet API
  description: >-
    The Docqet server's API: what software can do, who it serves, and how
    ready it is, for the projects applied to it. It serves its health,
    the endpoints the CLI sends each project's states through and reads
    them back from, and the resources the UI reads: each product's docs, put
    together across its projects, with the figures worked out for them, as
    [the plan](https://github.com/docqet/docqet/blob/main/docs/architecture/api.md)
    describes.


    Every list is a bare JSON array, a page at a time: `?page=` picks the
    page, from 1, and `?size=` how many it holds, 100 unless asked, and at
    most 500. The `X-Total-Count` header says how many there are in all, and
    the `Link` header links the pages around it.


    ## Stability


    Every endpoint carries a
    [stability level](https://github.com/docqet/docqet/blob/main/docqet/concepts/stability-level.md):
    Prototype, Alpha, Beta, or GA. Below GA it shows as a mark beside the
    endpoint and in the navigation, which says what to expect when you hover,
    focus, or tap it, and every endpoint states it in its `x-stability`
    field. Each group of endpoints shows its
    [maturity](https://github.com/docqet/docqet/blob/main/docqet/concepts/maturity.md) in the
    navigation, and in the overview under Maturity below: how close its
    endpoints are to being stable and supported.


    **Prototype** endpoints explore an idea: they may change completely or be
    removed, without notice. Endpoints move up a level as they settle, and
    only GA endpoints promise no breaking changes within `/api/v1`.


    ## Maturity


    How close the API as a whole, and each group of endpoints, is to being
    stable and supported, worked out from its endpoints' stability levels.
    A group's maturity is a guide: before relying on an endpoint, check its
    own stability.


    ## Signing in


    There's no sign-in yet. Each client gets a Docqet server of their own,
    so one never holds another's projects, and it must only be reachable by
    that client's people, such as on a private network.
  version: 0.1.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local development, `docqet serve`
  - url: http://127.0.0.1:4100/api/v1
    description: This machine, `docqet ui`
tags:
  - name: Health
    description: Service availability checks.
  - name: Projects
    description: >-
      Each project's states, one per commit on its main branch, as
      `docqet apply` sends them and the CLI reads them back.
  - name: Products
    description: >-
      What a product's projects define, put together, with the figures worked
      out for it: what the UI reads. Every route but the list of products
      takes `?project=`, to show only some of the product's projects, and
      `?initiative=`, to show only what's part of one.
