get:
  operationId: getReadiness
  x-stability: prototype
  summary: Check the service is ready for traffic
  description: >-
    Reports the health of every server the process is running and every
    dependency they use, so the process is taken out of rotation while any is
    down. It runs one server, `http`, and uses no dependencies yet. Compose's
    healthcheck.
  tags:
    - Health
  # Public: infrastructure probes reach this without a token.
  security: []
  responses:
    "200":
      description: Every check is up.
      content:
        application/json:
          schema:
            $ref: "../../schemas.yml#/components/schemas/HealthStatus"
    "503":
      description: At least one check is down.
      content:
        application/json:
          schema:
            $ref: "../../schemas.yml#/components/schemas/HealthStatus"
