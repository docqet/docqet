get:
  operationId: listTradeoffs
  x-stability: prototype
  summary: List a product's tradeoffs
  description: >-
    Every tradeoff showing on the product's features, capabilities, mechanisms
    and components, with what it affects and the open decisions that affect
    it.
  tags:
    - Products
  # No sign-in yet: a server is only reachable by its client's people.
  security: []
  parameters:
    - $ref: "../../schemas.yml#/components/parameters/Product"
    - $ref: "../../schemas.yml#/components/parameters/ProjectsShown"
    - $ref: "../../schemas.yml#/components/parameters/Initiative"
    - $ref: "../../schemas.yml#/components/parameters/Page"
    - $ref: "../../schemas.yml#/components/parameters/Size"
  responses:
    "200":
      description: The tradeoffs, a page at a time.
      headers:
        Link:
          $ref: "../../schemas.yml#/components/headers/Link"
        X-Total-Count:
          $ref: "../../schemas.yml#/components/headers/TotalCount"
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../schemas.yml#/components/schemas/Tradeoff"
    "400":
      $ref: "../../schemas.yml#/components/responses/InvalidQuery"
    "404":
      $ref: "../../schemas.yml#/components/responses/ProductNotFound"
