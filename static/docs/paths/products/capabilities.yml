get:
  operationId: listCapabilities
  x-stability: prototype
  summary: List a product's capabilities
  description: >-
    The product's capabilities that are showing, each with its figures, what's
    left on it, and how it stands on each rule it follows and each expected
    outcome. `?stability=` and `?for=` narrow them as `docket list
    capabilities` does.
  tags:
    - Products
  # No sign-in yet: a server is only reachable by its client's people.
  security: []
  parameters:
    - $ref: "../../schemas.yml#/components/parameters/Product"
    - $ref: "../../schemas.yml#/components/parameters/ProjectsShown"
    - $ref: "../../schemas.yml#/components/parameters/Initiative"
    - name: stability
      in: query
      required: false
      description: >-
        Show only the capabilities at these levels, in short, separated by
        commas.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum: [draft, prototype, alpha, beta, ga]
        example: [beta, ga]
    - $ref: "../../schemas.yml#/components/parameters/For"
    - $ref: "../../schemas.yml#/components/parameters/Page"
    - $ref: "../../schemas.yml#/components/parameters/Size"
  responses:
    "200":
      description: The capabilities, a page at a time.
      headers:
        Link:
          $ref: "../../schemas.yml#/components/headers/Link"
        X-Total-Count:
          $ref: "../../schemas.yml#/components/headers/TotalCount"
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../schemas.yml#/components/schemas/Capability"
    "400":
      $ref: "../../schemas.yml#/components/responses/InvalidQuery"
    "404":
      $ref: "../../schemas.yml#/components/responses/ProductNotFound"
