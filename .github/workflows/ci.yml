name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.9.0
      - name: go fmt and go fix change nothing
        run: |
          go fmt ./...
          go fix ./...
          git diff --exit-code
      # Embeds ui/dist's placeholder, so it needs no UI build.
      - run: go build ./...
      # Docket documents itself with the kit installed, as any project does.
      - name: Docket's own docs have no problems
        run: go run ./cmd/docket check
      - name: The installed agent kit is kit/'s
        run: go run ./cmd/docket kit check

  vulnerabilities:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The latest 1.26 release, as the Dockerfile's golang:1.26 image builds
      # with, rather than go.mod's minimum: the standard library scanned is
      # the one deployed.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  ui-lint:
    name: UI lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      # ESLint, with eslint.config.js.
      - run: npm run lint

  ui-format:
    name: UI format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      # Prettier, with .prettierrc.json: run npm run format to fix.
      - run: npm run format:check

  ui-build:
    name: UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      # tsc -b, then Vite: type errors fail here.
      - run: npm run build

  docs-lint:
    name: API docs lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Lints static/docs with redocly.yaml and .redocly.lint-ignore.yaml.
      - run: npx redocly lint

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
