name: Publish

# Builds the image and pushes it to GitHub's container registry, as
# ghcr.io/<owner>/docket, tagged with its commit SHA, :latest, and the git tag
# when the commit has one. Nothing deploys it yet.

on:
  # Runs after CI finishes on main, rather than in parallel with it, so a
  # broken main is never published.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to publish (defaults to the checked-out ref)
        required: false

# The workflow's own token pushes the image, so no secret is needed.
permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Resolve commit
        id: commit
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
          REF_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "workflow_run" ]; then
            echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${INPUT_SHA:-$REF_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}
          fetch-tags: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image's tags, and the version `docket --version` reports: the git
      # tag when the commit has one, else the commit SHA.
      - name: Determine tags
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SHA: ${{ steps.commit.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}"
          TAGS="$IMAGE:latest"$'\n'"$IMAGE:$SHA"
          if [ "$EVENT" = "release" ]; then
            GIT_TAG="$RELEASE_TAG"
          else
            GIT_TAG=$(git tag --points-at HEAD | head -n1)
          fi
          VERSION="$SHA"
          if [ -n "$GIT_TAG" ]; then
            TAGS="$TAGS"$'\n'"$IMAGE:$GIT_TAG"
            VERSION="$GIT_TAG"
          fi
          {
            echo "version=$VERSION"
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Links the package to this repository on GHCR, and says which
          # commit it was built from.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
