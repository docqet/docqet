# The stability checklist: the qualities a capability is expected to have at
# each stability level. It's guidance for the people and agents building it,
# not a gate. It's part of the spec, so it's the same for every project,
# whatever kind of software it is: a web, mobile, or desktop app, an HTTP API,
# a CLI, a background job, or a library.
#
# - Each quality has an item for every level. `expect` is the outcome that
#   level needs of the quality, worded to fit any software: what's true, not
#   what was done to get there. An item without one needs nothing new at that
#   level.
# - `examples` are ways to get there: practices, tools, artifacts, and
#   standards. They're ideas to choose from, not requirements, and may or may
#   not fit a project: do what fits. A plain example fits any
#   kind of software. One with `kinds` fits only those, from the `kinds` list.
# - `not-yet` is work that belongs to a later level. Leave it until then.
#   Doing more than a level expects isn't better, and `not-yet` names the
#   work most often done too early.
# - A level includes everything the levels below it expect, unless `until`
#   names the last level an item applies to.
# - The `baseline` item is the security and privacy baseline. It holds at
#   every level, and is never a known gap.
# - An item's ID is `<quality>/<level>`, such as `functionality/beta`. A gap
#   names the item it falls short of by that ID.
# - "Users" means whatever uses it: people, other programs, or schedulers.
#
# The qualities draw on ISO/IEC 25010, Kubernetes' feature graduation and
# production readiness review, Google's SRE practice, AWS Well-Architected,
# and FURPS+, adapted to stability levels.

# The kinds of software an example can be for. A project can be several, such
# as a web app with an HTTP API and background jobs.
kinds:
  - id: web-app
    name: Web app
  - id: mobile-app
    name: Mobile app
  - id: desktop-app
    name: Desktop app
  - id: http-api
    name: HTTP API
  - id: cli
    name: CLI
  - id: background-job
    name: Background job
  - id: library
    name: Library

qualities:
  - id: utility
    name: Utility
    why: It's worth building, and this is the right way to build it.
    levels:
      prototype:
        expect: >-
          Those judging the idea can try it, or watch it run, enough to tell
          whether it's worth doing and whether this is the way to do it.
        examples:
          - text: A clickable UI with fake or hard-coded data.
            kinds: [web-app, mobile-app, desktop-app]
          - text: A stub endpoint or command that returns realistic output.
            kinds: [http-api, cli]
          - A script or notebook that runs the core idea on a sample.
          - A spike against the one real integration the idea depends on, when
            that's the open question.
        not-yet:
          - Polishing anything the idea doesn't depend on.
          - Building out the parts of the system that aren't the question.
      alpha:
        expect: >-
          It works end to end on the real system and is used for real, and
          what's learned shapes what comes next.
        examples:
          - Wired to real storage and services, with sample data where real
            data isn't needed.
          - A few people, teams, or systems using it for real work, or a job
            running on a real schedule.
          - Whether it's being used, and how, is recorded.
          - Notes on what worked and what didn't, feeding the next round of
            changes.
        not-yet:
          - Settling its shape. Big changes are still expected.
      beta:
        expect: >-
          The need and the solution are confirmed, so what changes from here
          is refinement, and what success looks like is agreed.
        examples:
          - Success measures agreed with whoever asked for it, such as
            adoption, time saved, error rates, or jobs completed.
          - Feedback is about details, not direction.
      ga:
        expect: Shown to deliver what it's for in real use.
        examples:
          - Usage or outcome numbers that meet the measures agreed at Beta.

  - id: usability
    name: Usability
    why: >-
      Its users, people or programs, can learn it, use it, and recover from
      mistakes on their own.
    levels:
      prototype:
        examples:
          - Whoever built it walks those trying it through it.
        not-yet:
          - User docs, or polishing flows beyond what trying the idea needs.
      alpha:
        expect: >-
          Those trying it can use its main path without help from whoever
          built it.
        examples:
          - A short note for those trying it, covering what it does, how to
            reach it, and what's missing.
          - text: Clear labels and an obvious flow through the main screens.
            kinds: [web-app, mobile-app, desktop-app]
          - text: Example requests for the main endpoints.
            kinds: [http-api]
          - text: "`--help` text."
            kinds: [cli]
          - text: A README with a quick start.
            kinds: [library]
        not-yet:
          - Complete docs, accessibility audits.
      beta:
        expect: >-
          Its users can learn and use it on their own, understand every outcome
          and what to do next, and recover from mistakes, and it works for
          everyone it's meant for.
        examples:
          - text: In-app help, or a guide to the main tasks.
            kinds: [web-app, mobile-app, desktop-app]
          - text: A reference for every endpoint, such as from an OpenAPI spec.
            kinds: [http-api]
          - text: "`--help` for every command, and a README."
            kinds: [cli]
          - text: Reference docs for its public API.
            kinds: [library]
          - text: Its inputs, outputs, schedule, and what to do when it fails.
            kinds: [background-job]
          - text: Loading, empty, and error states handled on purpose.
            kinds: [web-app, mobile-app, desktop-app]
          - text: >-
              Consistent status codes, and error bodies that say what went
              wrong without exposing internals.
            kinds: [http-api]
          - text: >-
              Clear error messages, distinct exit codes, and output that scripts
              can parse.
            kinds: [cli]
          - Confirmation, undo, or a dry run before anything destructive.
          - text: Keyboard access, labels, and contrast.
            kinds: [web-app, mobile-app, desktop-app]
          - text: >-
              Feedback for every action, showing that it's in progress, done,
              or failed.
            kinds: [web-app, mobile-app, desktop-app]
          - text: Forms that validate as you go, and say what to fix.
            kinds: [web-app, mobile-app, desktop-app]
          - text: Layouts that work at the screen sizes it's used on.
            kinds: [web-app, mobile-app]
          - text: >-
              A few real users watched trying the main tasks, and what tripped
              them up fixed.
            kinds: [web-app, mobile-app, desktop-app, cli]
          - Dates, times, numbers, and languages shown the way its users
            expect.
        not-yet:
          - A formal accessibility audit.
      ga:
        expect: >-
          Everything it does can be learned without asking anyone, it behaves
          consistently across its whole interface, and all of it works for
          everyone it's meant for.
        examples:
          - Complete docs, updated with each release.
          - text: Meets WCAG 2.2 AA, or the standard the project has adopted.
            kinds: [web-app, mobile-app, desktop-app]
          - text: >-
              A shared design system, so screens look and behave the same way.
            kinds: [web-app, mobile-app, desktop-app]
          - text: >-
              How well people complete the main tasks is measured, such as
              success rates or time taken.
            kinds: [web-app, mobile-app, desktop-app]
          - text: Naming, paging, and errors consistent across every endpoint.
            kinds: [http-api]
          - text: How to install, upgrade, and troubleshoot it.
            kinds: [mobile-app, desktop-app, cli, library]

  - id: functionality
    name: Functionality
    why: It does what it should, and is shown to keep doing it as it changes.
    levels:
      prototype:
        examples:
          - Run the main path by hand after each change.
        not-yet:
          - Automated tests, unless they're the quickest way to try the idea.
          - Handling edge cases or bad input.
      alpha:
        expect: >-
          The main path is known to work after every change, and errors are
          visible, never silent.
        examples:
          - End-to-end tests of the main path's happy path, through the public
            interface, with real dependencies.
          - text: A request to each endpoint gets the response it should.
            kinds: [http-api]
          - text: The main flow, driven through the UI.
            kinds: [web-app, mobile-app, desktop-app]
          - text: >-
              Run each command on a fixture, and check its output and exit code.
            kinds: [cli]
          - text: Run it on sample input, and check what it wrote.
            kinds: [background-job]
          - text: The common flows a consumer follows, through its public API.
            kinds: [library]
          - Acceptance tests for the core rules it follows, annotated with
            `docket:verifies`.
          - Tests run on every change, and a failure blocks merging.
          - Input validated where it enters.
        not-yet:
          - Unit and integration tests for edge cases, coverage targets, load
            tests.
      beta:
        expect: >-
          Unusual input and error paths are handled correctly, and are known to
          stay that way as it changes.
        examples:
          - Unit tests for logic, edge cases, and failure paths, such as
            empty, missing, duplicate, and oversized input.
          - Integration tests against the real database or systems it uses.
          - Acceptance tests for its edge-case rules too.
          - Contract tests for interfaces others depend on.
          - text: End-to-end tests of the main flows and their error states.
            kinds: [web-app, mobile-app, desktop-app]
          - For output that varies from run to run, such as an AI feature's,
            quality judged against a set of examples.
          - Data validated before it's written.
        not-yet:
          - Concurrency and failure-injection suites.
      ga:
        expect: >-
          Every critical workflow is known to work after every change, and a
          fixed bug stays fixed.
        examples:
          - End-to-end tests for every critical workflow.
          - A regression test with each bug fix.
          - Property-based tests where inputs vary widely.
          - No flaky or skipped tests left untracked.

  - id: reliability
    name: Reliability
    why: It keeps working, and recovers when something goes wrong.
    levels:
      prototype:
        examples:
          - Fake, hard-coded, or in-memory data, local files, or a throwaway
            database.
        not-yet:
          - Migrations, backups, retries, failover.
      alpha:
        examples:
          - Real storage, with data that may be reset, and those using it know
            that.
          - A script to reset or seed its data.
        not-yet:
          - Migrations that preserve data, backups, rollback plans.
      beta:
        expect: >-
          Data that people or systems put in is kept across changes, a bad
          release can be undone, and when something it depends on is slow or
          down, it fails clearly or degrades gracefully instead of hanging.
        examples:
          - Versioned migrations run by the release, never by hand.
          - A down migration, or a backup taken before a risky change.
          - text: A rollback to the previous release.
            kinds: [web-app, http-api, background-job]
          - text: A quick fixed release.
            kinds: [mobile-app, desktop-app, cli, library]
          - It can be switched off quickly without a release, such as with a
            kill switch.
          - Timeouts on every call to a dependency, with retries only where
            they're safe.
          - text: Local data migrated on upgrade.
            kinds: [mobile-app, desktop-app]
          - text: Files it wrote can still be read after an upgrade.
            kinds: [cli, library]
        not-yet:
          - Restore drills, chaos testing, running in several regions.
      ga:
        expect: >-
          It holds up under overlapping runs, partial failures, and retries,
          and meets its availability target. Recovering from a bad release or
          a loss of data is known to work.
        examples:
          - Operations safe to repeat, such as with idempotency keys or
            upserts.
          - Tests for two runs at once, and for retrying after a crash halfway
            through.
          - It fails safe where failing could cause harm, stopping rather than
            charging twice, sending twice, or acting on bad data.
          - text: An agreed availability target, such as 99.9%, that's measured.
            kinds: [web-app, http-api]
          - A rollback that's been practiced, including upgrading, downgrading,
            and upgrading again.
          - Automated backups, with a restore that's been tested.
          - Migrations tried on production-sized data before they ship.
          - text: Rerunning a time range rebuilds what it produced.
            kinds: [background-job]

  - id: efficiency
    name: Efficiency
    why: >-
      It's fast enough for the work, at the load it gets, at a cost that makes
      sense.
    levels:
      prototype:
        examples:
          - Fast enough that those trying it can judge the idea.
        not-yet:
          - Optimizing, caching, load testing.
      alpha:
        examples:
          - Fix what's slow enough to get in the way of real use.
        not-yet:
          - Load tests, caches, scaling work.
      beta:
        expect: Works at realistic volumes, and the work it does is bounded.
        examples:
          - Tried with realistic amounts of data and use.
          - No query or call for each item in a list, and indexes where
            queries need them.
          - Paging, input size limits, and streaming instead of loading
            everything into memory.
          - Limits on what it accepts and returns are documented.
          - text: Finishes well within its schedule at realistic volumes.
            kinds: [background-job]
          - text: Starts quickly.
            kinds: [cli, desktop-app, mobile-app]
          - text: Usable on a slow connection.
            kinds: [mobile-app]
        not-yet:
          - Performance targets, capacity planning.
      ga:
        expect: >-
          Meets agreed targets for speed and cost at peak load, with headroom,
          and its limits are known.
        examples:
          - Measured targets for response time, throughput, or how long a job
            takes.
          - A load test at expected peak, with room to spare.
          - The rate limits and quotas of what it depends on fit peak use.
          - What it costs to run, per unit of work, is known and acceptable.
          - Alerts before it reaches a known capacity limit.
          - text: Memory, battery, and data use fit the devices it runs on.
            kinds: [mobile-app, desktop-app]

  - id: security
    name: Security
    why: >-
      Systems and data are protected the same way at every level, and it
      follows the rules that apply to it.
    levels:
      prototype:
        baseline: true
        expect: >-
          Secrets stay out of code, version control, sample data, logs, and
          output. Real data comes only through the real systems, never copied
          into code or fixtures. Only those allowed can reach real systems or
          data, and one tenant or account never sees or changes another's. Personal data is collected only where it's needed.
          Untrusted input can't run as code or commands.
        examples:
          - Secrets in the environment or a secret store.
          - Sample data that's made up, not exported from production.
          - Every read and write scoped to the tenant or account making it.
          - Established libraries for authentication and cryptography, never
            hand-rolled ones.
          - Parameterized queries, escaped output, and no shell commands built
            from input.
      alpha:
        expect: >-
          It depends on nothing less stable than itself, and its dependencies
          are maintained and licensed for how it's used.
        examples:
          - Nothing it relies on is at an earlier stability level, such as a
            prototype service, or a third party's preview API.
          - Licenses checked when a dependency is added.
          - Dependency versions pinned, such as with a lock file.
        not-yet:
          - Security reviews, compliance audits.
      beta:
        expect: >-
          Protected against misuse at the level it's exposed, and the legal and
          regulatory duties that apply are known and met.
        examples:
          - text: >-
              Authentication on every endpoint, rate limits, and input size
              limits.
            kinds: [http-api, web-app]
          - text: Protection against cross-site request forgery.
            kinds: [web-app]
          - text: The checks in OWASP ASVS level 1.
            kinds: [web-app, http-api]
          - text: >-
              What it receives is checked for who sent it, such as signed
              webhooks.
            kinds: [http-api, background-job]
          - Known vulnerabilities in dependencies found and fixed.
          - Privacy duties met, such as exporting or deleting someone's
            personal data on request.
          - Rules about where data may be stored, and for how long.
      ga:
        expect: >-
          Its handling of credentials, payments, personal data, and permissions
          is known to be sound. Each part has only the access it needs, and
          sensitive actions can be traced to who did them.
        examples:
          - A security review of sign-in and permission checks.
          - text: The checks in OWASP ASVS level 2.
            kinds: [web-app, http-api]
          - Service accounts and tokens limited to what each part needs.
          - An audit log of sensitive actions.
          - Data and logs kept no longer than they're needed.
          - Builds that can be traced to their source, with a list of what's
            in them, such as SLSA provenance and an SBOM.
          - text: Signed releases.
            kinds: [mobile-app, desktop-app, cli, library]
          - A penetration test, where the risk warrants one.

  - id: compatibility
    name: Compatibility
    why: >-
      It works with the systems, platforms, and standards around it, and
      doesn't break those depending on it as it changes.
    levels:
      prototype:
        until: alpha
        expect: >-
          It reaches only those who chose to try it, is marked with its
          stability level, and can be removed without affecting anything people
          rely on.
        examples:
          - Behind a feature flag that's off by default.
          - text: A separate environment, or a preview deploy.
            kinds: [web-app, http-api, background-job]
          - text: A preview endpoint, or an experimental command or flag.
            kinds: [http-api, cli]
          - text: An experimental module, or a pre-release version.
            kinds: [library]
          - A prototype or alpha label wherever it's used.
        not-yet:
          - Versioning, announcing changes, supporting several platforms.
      alpha:
        expect: >-
          Its interfaces follow the common standards for what it does, so
          others can work with it without surprises.
        examples:
          - Standard formats, such as UTF-8 text and RFC 3339 timestamps with
            a time zone.
          - text: >-
              Methods and status codes as HTTP defines them (RFC 9110), and
              errors as problem details (RFC 9457).
            kinds: [http-api]
          - text: >-
              Output on stdout, errors on stderr, meaningful exit codes, and the
              platform's usual flag style, with `--help` and `--version`.
            kinds: [cli]
          - text: Semantic HTML, with native controls before custom ones.
            kinds: [web-app]
          - text: The language's packaging conventions, and semantic versioning.
            kinds: [library]
          - text: Standard schedule syntax, such as cron expressions.
            kinds: [background-job]
          - Opt-in for invited people or systems, still behind a flag.
          - Breaking changes made freely, with those trying it told.
        not-yet:
          - Deprecation windows, testing on every platform.
      beta:
        expect: >-
          It's available to everyone it's meant for, without opting in, on the
          platforms and environments it supports. Those depending on it hear
          about changes, and breaking ones are rare and announced ahead of time
          where possible.
        examples:
          - The project's normal release pipeline, with no opting in.
          - Release notes or a changelog.
          - A beta label wherever it's used.
          - text: Versioning, so a breaking change is visible.
            kinds: [http-api, library]
          - text: An OpenAPI description, checked on every change.
            kinds: [http-api]
          - Messages and events checked against their schemas.
          - Settings that differ between environments kept out of code.
          - text: Supported browsers listed.
            kinds: [web-app]
          - text: Installs and upgrades cleanly on each supported platform.
            kinds: [mobile-app, desktop-app, cli, library]
        not-yet:
          - Deprecation windows, compatibility guarantees.
      ga:
        expect: >-
          Its interface is stable, with breaking changes as a new version and
          the old one kept working for a set time, and it's known to work on
          every platform it supports.
        examples:
          - Semantic versioning, with deprecation warnings before removal.
          - text: A new version alongside the old one.
            kinds: [http-api]
          - text: >-
              Older installed versions keep working against the services they
              use.
            kinds: [mobile-app, desktop-app]
          - text: Upgrading from every supported version is tested.
            kinds: [mobile-app, desktop-app, cli, library]
          - Tests run on each supported platform and runtime version.

  - id: observability
    name: Observability
    why: When something goes wrong, someone finds out and can see why.
    levels:
      prototype:
        examples:
          - Console output is enough.
        not-yet:
          - Logging setup, error tracking, metrics.
      alpha:
        expect: When an error happens, someone looking can see what happened.
        examples:
          - Error logs that include the operation, the IDs of what it was
            working on, and a request or run ID.
          - text: Errors on stderr, with a non-zero exit code.
            kinds: [cli]
          - text: Crash logs a developer can get at.
            kinds: [mobile-app, desktop-app]
        not-yet:
          - Dashboards, alerts, tracing.
      beta:
        expect: >-
          Whoever runs it can tell it's healthy, and hears about errors and
          failed or missed runs without searching for them.
        examples:
          - An error tracker that notifies people.
          - text: A health endpoint, with an uptime check.
            kinds: [http-api, web-app]
          - text: A notification when a run fails or doesn't happen.
            kinds: [background-job]
          - text: Crash reporting, with consent.
            kinds: [mobile-app, desktop-app]
          - text: Problems reach the issue tracker, with version details.
            kinds: [cli, library]
          - How often key operations run and fail, and how long they take, is
            recorded.
          - A dashboard of its key metrics, such as traffic, errors, latency,
            and queue depth.
        not-yet:
          - Service level objectives, paging, distributed tracing.
      ga:
        expect: >-
          Whoever runs it finds out about failures that matter to its users
          before they're reported, and knows what to do about each one.
        examples:
          - Automated alerts on error rate, latency, and availability against
            agreed targets.
          - Service level objectives, with an alert when the error budget is
            being used up fast.
          - Each alert links to a runbook.
          - text: Runbooks for deploying, rolling back, and diagnosing it.
            kinds: [web-app, http-api, background-job]
          - Whether its main workflows succeed is measured, not just whether
            it's up.
          - Traces that follow a critical workflow from start to finish.
          - text: Alerts on lateness and backlog, not just failure.
            kinds: [background-job]

  - id: maintainability
    name: Maintainability
    why: >-
      It's easy to understand and change, and easy to see what a change will
      affect, because its complexity is kept to what it needs.
    levels:
      prototype:
        examples:
          - Whatever answers the question fastest. Copying, hard-coding, and
            shortcuts are fine.
        not-yet:
          - Abstractions, configurability, cleanup, or structuring for reuse.
      alpha:
        expect: >-
          It's built the way the rest of the project is, so anyone who knows
          the project can follow it.
        examples:
          - The language's linter, formatter, and type checker, run on every
            change.
          - The language's idioms, and the patterns the project already uses
            for similar work.
          - The project's existing architecture, with its layers, boundaries,
            and places things go, instead of a new one.
          - Established libraries for solved problems, such as dates, parsing,
            and retries, instead of hand-rolled ones.
          - A README on setting it up and running it locally, and its
            configuration.
          - Review by another engineer or an agent.
        not-yet:
          - Generalizing for cases nobody has asked for.
          - Interfaces, plugin points, or settings with a single use.
          - New layers, services, or architectural patterns it doesn't need
            yet.
      beta:
        expect: >-
          Its structure matches the shape it settled on, with clear boundaries,
          so what a change affects is easy to see. Earlier shortcuts are
          removed or tracked, and every piece of complexity has a reason it
          needs now.
        examples:
          - Code that survived from the prototype or alpha refactored or
            replaced.
          - Boundaries and dependencies that follow its shape, such as domain
            logic that doesn't depend on its transport or storage.
          - Parts that can be tested on their own.
          - Real duplication combined once there's a second real use.
          - Shortcuts that remain recorded as known gaps.
          - A note on how it's built, and the key decisions behind it.
          - Code and tests annotated with the rules they implement and verify,
            using `docket:implements` and `docket:verifies`, so changing a rule
            shows what it touches.
        not-yet:
          - Hardening or scaling for load it doesn't have.
      ga:
        expect: >-
          Another engineer can change it confidently without the author, and
          can tell what a change will affect, with no dead code, untracked
          TODOs, or unexplained complexity.
        examples:
          - Names and structure that explain themselves, with comments only
            where the reason isn't obvious.
          - Dependencies between parts explicit, with no hidden coupling
            through shared state or globals.
          - Dead code, and flags left over from earlier levels, removed.

  - id: supportability
    name: Supportability
    why: >-
      Someone is responsible for it, and those depending on it know where to
      turn and what to expect when it breaks.
    levels:
      prototype:
        examples:
          - Whoever is exploring the idea.
        not-yet:
          - Bug tracking, support.
      alpha:
        expect: >-
          It has an owner who decides its direction, and problems can be
          reported and aren't lost.
        examples:
          - A named person or team.
          - Bugs recorded in the team's tracker.
          - Those trying it know where to report a problem.
        not-yet:
          - Support commitments, on-call.
      beta:
        expect: >-
          Known problems are fixed as they're found, and visible to those
          depending on it.
        examples:
          - Bugs triaged regularly.
          - Known issues listed in the docs, the release notes, or its known
            gaps.
        not-yet:
          - Support response times, on-call.
      ga:
        expect: >-
          The owner is responsible for it long term. Those depending on it know
          where to get help and what response to expect, and someone other than
          the author can change and operate it.
        examples:
          - A support channel, with expected response times.
          - On-call, or someone to reach outside working hours, if it's
            critical enough.
          - text: A status page or announcement during an outage.
            kinds: [web-app, mobile-app, http-api]
          - Reviews of serious incidents, so they're less likely to happen
            again.
          - More than one engineer able to work on it.
