# Marks this repository as a Docket project. Its docs are in docs/product/.
project:
  id: hotel-billing
  name: Hotel Billing

# Test results for `docket index` to read, written by the test run before it.
results:
  - suite: acceptance
    format: cucumber-json
    path: reports/acceptance.json
  - suite: unit
    format: junit
    path: reports/unit.xml
