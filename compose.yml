services:
  # Brings the database up to this version's schema, then exits. Migrations
  # are a step of their own, so the app waits for it rather than migrating as
  # it starts.
  migrate:
    build: &build
      context: .
      dockerfile: Dockerfile
      target: runner
    command: ["docket", "migrate"]
    environment:
      DATABASE_PATH: /var/lib/docket/docket.db
    volumes:
      - docket-data:/var/lib/docket

  app:
    build: *build
    command: ["docket", "serve"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: "8080"
      DATABASE_PATH: /var/lib/docket/docket.db
    # The server's SQLite database lives on the docket-data volume, so it
    # survives restarts; `docker compose down -v` wipes it.
    volumes:
      - docket-data:/var/lib/docket
    # Lets the app reach services published on the host as
    # host.docker.internal, on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"
    healthcheck:
      # 127.0.0.1, not localhost: localhost can resolve to ::1 first and an
      # IPv4-only listener then fails the probe.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/v1/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Probed every 2s while starting, so `docker compose up --wait` doesn't
      # sit out the first 30s interval.
      start_period: 30s
      start_interval: 2s

volumes:
  docket-data:
