services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    command: ["docqet", "serve"]
    environment:
      PORT: "8080"
      DATABASE_PROVIDER: sqlite
      DATABASE_PATH: /var/lib/docqet/docqet.db
      # This stack is for local development, so the server migrates its
      # database as it starts. It's off by default everywhere else.
      MIGRATE: "true"
    # The server's SQLite database lives on the docqet-data volume, so it
    # survives restarts; `docker compose down -v` wipes it.
    volumes:
      - docqet-data:/var/lib/docqet
    # Lets the app reach services published on the host as
    # host.docker.internal, on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"
    healthcheck:
      # 127.0.0.1, not localhost: localhost can resolve to ::1 first and an
      # IPv4-only listener then fails the probe.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/v1/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Probed every 2s while starting, so `docker compose up --wait` doesn't
      # sit out the first 30s interval.
      start_period: 30s
      start_interval: 2s

volumes:
  docqet-data:
